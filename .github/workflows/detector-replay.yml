name: Detector measurement replay

on:
  workflow_call:
    inputs:
      recordings:
        description: 'Optional comma-separated recording IDs; only complete time groups'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: detector-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      settings: ${{ steps.catalog.outputs.settings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: catalog
        run: python tests/ci_settings.py outputs
        env:
          SAUNA_TEST_CHECKS: core

  detector_replay:
    needs: configuration
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.sessions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_core }}
      - name: Check replay chronology and observation neutrality
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.core }}
        env:
          SAUNA_DETECTOR_EVIDENCE: ${{ runner.temp }}/ha-sauna-detector-replay
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          evidence="$SAUNA_DETECTOR_EVIDENCE/checks"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git rev-parse HEAD:custom_components/ha_sauna > "$evidence/product-tree.txt"
          set +e
          python -m unittest discover -s tests -p test_detector_replay.py -v > "$evidence/stdout.log" 2> "$evidence/stderr.log"
          result=$?
          echo "$result" > "$evidence/exit-code.txt"
          echo completed > "$evidence/process-completed.txt"
          cat "$evidence/stdout.log"
          cat "$evidence/stderr.log" >&2
          exit "$result"
      - name: Replay original measurements through the current detector
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.sessions }}
        env:
          SAUNA_DETECTOR_EVIDENCE: ${{ runner.temp }}/ha-sauna-detector-replay
          SAUNA_DETECTOR_RECORDINGS: ${{ inputs.recordings }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          evidence="$SAUNA_DETECTOR_EVIDENCE/replay"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git rev-parse HEAD:custom_components/ha_sauna > "$evidence/product-tree.txt"
          set +e
          python -u tests/analysis/detector_replay.py --manifest tests/replay_measurement_manifest.json --recordings "$SAUNA_DETECTOR_RECORDINGS" --output "$evidence/output" > "$evidence/stdout.log" 2> "$evidence/stderr.log"
          result=$?
          echo "$result" > "$evidence/exit-code.txt"
          echo completed > "$evidence/process-completed.txt"
          cat "$evidence/stdout.log"
          cat "$evidence/stderr.log" >&2
          exit "$result"
      - name: Preserve process evidence and complete detector results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: detector-measurement-replay
          path: ${{ runner.temp }}/ha-sauna-detector-replay
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
