name: HA Sauna
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
  ha-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.9.2' 'securetar==2026.4.1' 'cronsim==2.7'
      - run: python -m unittest discover -s tests/ha -v
        env:
          HA_TEST_REQUIRED: '1'
  ha-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.9.2' 'securetar==2026.4.1' 'cronsim==2.7'
      - run: python -m unittest discover -s tests/integration -v
        env:
          HA_TEST_REQUIRED: '1'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.9.2' 'home-assistant-frontend==20260826.7' 'securetar==2026.4.1' 'cronsim==2.7' 'playwright==1.63.0'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/browser -v
        env:
          HA_TEST_REQUIRED: '1'
