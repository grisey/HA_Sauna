name: HA Sauna
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
        timeout-minutes: 2
      - run: node --test tests/panel_*.test.js
        timeout-minutes: 2
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.9.2' 'securetar==2026.4.1' 'cronsim==2.7'
      - run: python -m unittest discover -s tests/ha -v
        timeout-minutes: 2
        env:
          HA_TEST_REQUIRED: '1'
      - run: python -m unittest discover -s tests/integration -v
        timeout-minutes: 2
        env:
          HA_TEST_REQUIRED: '1'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/browser -v
        timeout-minutes: 2
        env:
          HA_TEST_REQUIRED: '1'
