name: HA Sauna
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
        timeout-minutes: 2
      - run: node --test tests/panel_*.test.js
        timeout-minutes: 2
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.9.2' 'securetar==2026.4.1' 'cronsim==2.7'
      - name: Versionsformat für Home Assistant und HACS prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from awesomeversion import AwesomeVersion

          manifest = json.loads(Path("custom_components/ha_sauna/manifest.json").read_text())
          version = AwesomeVersion(manifest["version"])
          assert version.valid, f"Ungültige Version: {version}"
          print(f"Version: {version}; Format: {version.strategy.value}; Beta: {version.beta}")
          PY
      - run: python -m unittest discover -s tests/ha -v
        timeout-minutes: 2
        env:
          HA_TEST_REQUIRED: '1'
      - run: python -m unittest discover -s tests/integration -v
        env:
          HA_TEST_REQUIRED: '1'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r tests/browser/requirements.txt
      - name: Kompressionsbackend prüfen
        run: |
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from isal import isal_zlib
          import aiohttp_fast_zlib
          from aiohttp.compression_utils import ZLibBackend

          assert version("isal") == "1.8.0"
          assert aiohttp_fast_zlib.best_zlib is isal_zlib
          aiohttp_fast_zlib.enable()
          assert ZLibBackend.name == isal_zlib.__name__
          print(f"Kompressionsbackend: {ZLibBackend.name}")
          PY
      - run: python -m playwright install --with-deps chromium
      - run: python -u tests/browser/run.py
        env:
          HA_TEST_REQUIRED: '1'
