name: HA Sauna
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
        timeout-minutes: 2
      - run: node --test tests/panel_*.test.js
        timeout-minutes: 2
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.10.0' 'securetar==2026.4.1' 'cronsim==2.7'
      - name: Versionsformat für Home Assistant und HACS prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from awesomeversion import AwesomeVersion

          manifest = json.loads(Path("custom_components/ha_sauna/manifest.json").read_text())
          version = AwesomeVersion(manifest["version"])
          assert version.valid, f"Ungültige Version: {version}"
          print(f"Version: {version}; Format: {version.strategy.value}; Beta: {version.beta}")
          PY
      - run: python -m unittest discover -s tests/ha -v
        timeout-minutes: 2
        env:
          HA_TEST_REQUIRED: '1'
      - run: python -m unittest discover -s tests/integration -v
        env:
          HA_TEST_REQUIRED: '1'
          HA_SAUNA_HANDOFF_EVIDENCE: ${{ runner.temp }}/ha-sauna-system-forms
      - name: Vollständige Systemformen aus isolierter HA-Testfixture sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ha-system-forms
          path: ${{ runner.temp }}/ha-sauna-system-forms
          if-no-files-found: error
          retention-days: 7
  session-matrix:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cases
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          derived = json.loads(Path("tests/scenario_manifest.json").read_text())["scenarios"]
          replay = json.loads(Path("tests/replay_manifest.json").read_text())["sessions"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("cases=" + json.dumps([case["id"] for case in derived + replay]) + "\n")
          PYTHON
  sessions:
    needs: session-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.session-matrix.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.2'
      - run: python -m pip install 'homeassistant==2026.10.0' 'securetar==2026.4.1' 'cronsim==2.7'
      - name: Vollständige Sitzungen und gebundene Realdaten-Replays
        run: |
          mkdir -p "$SAUNA_SESSION_EVIDENCE"
          git rev-parse HEAD > "$SAUNA_SESSION_EVIDENCE/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$SAUNA_SESSION_EVIDENCE/tree.txt"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          pr_head = os.environ.get("SAUNA_PR_HEAD_SHA") or None
          checkout = git("rev-parse", "HEAD")
          checkout_tree = git("rev-parse", "HEAD^{tree}")
          pr_tree = git("rev-parse", f"{pr_head}^{{tree}}") if pr_head else None
          metadata = {
              "schema_version": 1,
              "pr_head": {"commit": pr_head, "tree": pr_tree},
              "checkout": {
                  "commit": checkout, "tree": checkout_tree,
                  "symbolic_branch": git("branch", "--show-current") or None,
                  "github_ref": os.environ["GITHUB_REF"],
                  "head_ref": os.environ.get("GITHUB_HEAD_REF") or None,
              },
              "tree_comparison": ("equal" if pr_tree == checkout_tree else "different")
                                 if pr_tree else "no_pr_head",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "case": os.environ["SAUNA_SESSION_CASE"],
              "runner_os": os.environ["RUNNER_OS"],
              "process": {
                  "command": "python -m unittest discover -s tests/sessions -v",
                  "log": "process.log", "exit_code": "exit-code.txt",
                  "completion": "process-completion.json",
              },
          }
          path = Path(os.environ["SAUNA_SESSION_EVIDENCE"]) / "run-metadata.json"
          path.write_text(json.dumps(metadata, indent=2, sort_keys=True,
                                     allow_nan=False) + "\n", encoding="utf-8")
          PY
          set +e
          python -m unittest discover -s tests/sessions -v > "$SAUNA_SESSION_EVIDENCE/process.log" 2>&1
          result=$?
          echo "$result" > "$SAUNA_SESSION_EVIDENCE/exit-code.txt"
          SAUNA_PROCESS_EXIT_CODE="$result" python - <<'PY'
          import json, os
          from pathlib import Path

          completion = {
              "process_returned": True,
              "exit_code": int(os.environ["SAUNA_PROCESS_EXIT_CODE"]),
              "job_conclusion": "Recorded separately by GitHub Actions after artifact upload",
          }
          path = Path(os.environ["SAUNA_SESSION_EVIDENCE"]) / "process-completion.json"
          path.write_text(json.dumps(completion, indent=2, sort_keys=True,
                                     allow_nan=False) + "\n", encoding="utf-8")
          PY
          cat "$SAUNA_SESSION_EVIDENCE/process.log"
          exit "$result"
        timeout-minutes: 40
        env:
          HA_TEST_REQUIRED: '1'
          TMPDIR: /dev/shm
          SAUNA_SESSION_CASE: ${{ matrix.case }}
          SAUNA_SESSION_EVIDENCE: ${{ runner.temp }}/ha-sauna-sessions
          SAUNA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Gebundene Sitzungsbewertungen sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-${{ matrix.case }}
          path: ${{ runner.temp }}/ha-sauna-sessions
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r tests/browser/requirements.txt
      - name: Kompressionsbackend prüfen
        run: |
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from isal import isal_zlib
          import aiohttp_fast_zlib
          from aiohttp.compression_utils import ZLibBackend

          assert version("isal") == "1.8.0"
          assert aiohttp_fast_zlib.best_zlib is isal_zlib
          aiohttp_fast_zlib.enable()
          assert ZLibBackend.name == isal_zlib.__name__
          print(f"Kompressionsbackend: {ZLibBackend.name}")
          PY
      - run: python -m playwright install --with-deps chromium
      - name: Node-Browserwerkzeuge vorbereiten
        run: |
          python - <<'PY'
          import os
          import subprocess
          from importlib.metadata import version
          from pathlib import Path

          runtime = Path(os.environ["RUNNER_TEMP"]) / "ha-sauna-node"
          subprocess.run([
              "npm", "install", "--prefix", str(runtime), "--ignore-scripts",
              "--no-package-lock", f"playwright@{version('playwright')}",
          ], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"NODE_PATH={runtime / 'node_modules'}\n")
          PY
      - name: Sitzungsverlauf – Browserinteraktionen
        run: node tests/browser/live_history/accept.cjs
        timeout-minutes: 2
        env:
          ENGINE: chromium
          HISTORY_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/live-history
      - name: Sitzungsverlauf – Lade- und Aktualisierungsmessung
        run: node tests/browser/live_history/profile.cjs
        timeout-minutes: 2
        env:
          ENGINE: chromium
          HISTORY_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/live-history
      - name: Sitzungsverlauf – Zoom und Nachträge
        run: node tests/browser/live_history/interaction.cjs
        timeout-minutes: 2
        env:
          ENGINE: chromium
          INTERACTION_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/live-history/interaction.json
      - run: python -u tests/browser/run.py
        timeout-minutes: 15
        env:
          HA_TEST_REQUIRED: '1'
          HA_SAUNA_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/ha-sauna-browser
      - name: Browseransichten sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-views
          path: ${{ runner.temp }}/ha-sauna-browser
          if-no-files-found: ignore
          retention-days: 7
