name: HA Sauna
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: 'Comma-separated checks: core,ha,browser,sessions; empty runs all'
        type: string
        default: ''
      core_tests:
        description: 'Optional comma-separated core unittest names: test_module.Class.test_method; skips panel tests'
        type: string
        default: ''
      session_cases:
        description: 'Optional comma-separated manifest IDs for sessions, e.g. G02-proxy,R03'
        type: string
        default: ''
      replay_profile:
        description: 'Profile the existing session run'
        type: boolean
        default: false
      proxy_form_analysis:
        description: 'Analyze all original replay climate curves without running the controller'
        type: boolean
        default: false
      proxy_candidate_analysis:
        description: 'Analyze mathematical proxy candidates on R01–R04 without running the controller; takes precedence over form analysis'
        type: boolean
        default: false
      proxy_expectation_analysis:
        description: 'Run only the diagnostic analysis of explicit expectations on stored original replays; takes precedence over other analysis flags'
        type: boolean
        default: false
      proxy_expectation_cases:
        description: 'Explicit schema-version-1 JSON string with cases for proxy_expectation_analysis'
        type: string
        default: ''
      integration_tests:
        description: 'Optional comma-separated integration unittest names: test_module.Class.test_method'
        type: string
        default: ''
      ha_tests:
        description: 'Optional comma-separated HA adapter unittest names: test_module.Class.test_method'
        type: string
        default: ''
      curve_compare:
        description: 'Run only a paired comparison of the unchanged CurveChangeTests class'
        type: boolean
        default: false
      curve_base:
        description: 'Exact full base commit SHA for curve_compare'
        type: string
        default: ''
      curve_candidate:
        description: 'Exact full candidate commit SHA for curve_compare'
        type: string
        default: ''
      curve_repetitions:
        description: 'Complete class repetitions per measured block'
        type: number
        default: 10
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ inputs.proxy_expectation_analysis && 'proxy-expectation-analysis' || inputs.proxy_candidate_analysis && 'proxy-candidate-analysis' || inputs.checks || 'all' }}
  cancel-in-progress: true
jobs:
  configuration:
    # Bootstrap on the GitHub-hosted Linux provider; all run settings come from the catalogue.
    runs-on: ubuntu-latest
    outputs:
      settings: ${{ steps.catalog.outputs.settings }}
      browser: ${{ steps.catalog.outputs.browser }}
      cases: ${{ steps.catalog.outputs.cases }}
      checks: ${{ steps.catalog.outputs.checks }}
      core_tests: ${{ steps.catalog.outputs.core_tests }}
      integration_tests: ${{ steps.catalog.outputs.integration_tests }}
      ha_tests: ${{ steps.catalog.outputs.ha_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dispatch-Auswahl prüfen
        if: ${{ !inputs.proxy_expectation_analysis }}
        run: python -m unittest discover -s tests -p test_ci_settings.py -v
      - id: catalog
        run: python tests/ci_settings.py outputs
        env:
          SAUNA_TEST_CHECKS: ${{ inputs.checks }}
          SAUNA_CORE_TESTS: ${{ inputs.core_tests }}
          SAUNA_SESSION_CASES: ${{ inputs.session_cases }}
          SAUNA_INTEGRATION_TESTS: ${{ inputs.integration_tests }}
          SAUNA_HA_TESTS: ${{ inputs.ha_tests }}
  core:
    needs: configuration
    if: ${{ !inputs.curve_compare && !inputs.proxy_form_analysis && !inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis && contains(fromJSON(needs.configuration.outputs.checks), 'core') }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_core }}
      - name: Fachkern prüfen
        run: |
          mkdir -p "$SAUNA_CORE_EVIDENCE"
          git rev-parse HEAD > "$SAUNA_CORE_EVIDENCE/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$SAUNA_CORE_EVIDENCE/tree.txt"
          set +e
          python tests/ci_settings.py core > "$SAUNA_CORE_EVIDENCE/process.log" 2>&1
          result=$?
          echo "$result" > "$SAUNA_CORE_EVIDENCE/exit-code.txt"
          echo completed > "$SAUNA_CORE_EVIDENCE/process-completed.txt"
          cat "$SAUNA_CORE_EVIDENCE/process.log"
          exit "$result"
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.core }}
        env:
          SAUNA_CORE_TESTS: ${{ inputs.core_tests }}
          SAUNA_CORE_EVIDENCE: ${{ runner.temp }}/ha-sauna-core
      - run: node --test tests/panel_*.test.js
        if: ${{ !cancelled() && needs.configuration.outputs.core_tests == '[]' }}
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.panel }}
      - name: Fachkernprozess sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-tests
          path: ${{ runner.temp }}/ha-sauna-core
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  proxy_expectation_analysis:
    needs: configuration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy_expectation_analysis }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.sessions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_core }}
      - name: Explizite Erwartungen an gespeicherten Original-Replays auswerten
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.sessions }}
        env:
          SAUNA_EXPECTATION_CASES: ${{ inputs.proxy_expectation_cases }}
          SAUNA_EXPECTATION_EVIDENCE: ${{ runner.temp }}/ha-sauna-proxy-expectations
        run: |
          evidence="$SAUNA_EXPECTATION_EVIDENCE"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git rev-parse HEAD:custom_components/ha_sauna > "$evidence/product-tree.txt"
          set +e
          python tests/analysis/proxy_expectation_analysis.py --cases-json "$SAUNA_EXPECTATION_CASES" --output "$evidence/output" > "$evidence/stdout.log" 2> "$evidence/stderr.log"
          result=$?
          echo "$result" > "$evidence/exit-code.txt"
          echo completed > "$evidence/process-completed.txt"
          cat "$evidence/stdout.log"
          cat "$evidence/stderr.log" >&2
          exit "$result"
      - name: Erwartungsanalyse und Prozessnachweise sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-expectation-analysis
          path: ${{ runner.temp }}/ha-sauna-proxy-expectations
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  proxy_candidate_analysis:
    needs: configuration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.sessions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_core }}
      - name: Mathematische Proxykandidaten unabhängig prüfen
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.core }}
        run: |
          SAUNA_CANDIDATE_EVIDENCE="$RUNNER_TEMP/ha-sauna-proxy-candidates"
          evidence="$SAUNA_CANDIDATE_EVIDENCE/test-process"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git rev-parse HEAD:custom_components/ha_sauna > "$evidence/product-tree.txt"
          set +e
          python -m unittest discover -s tests -p test_proxy_candidate_models.py -v > "$evidence/stdout.log" 2> "$evidence/stderr.log"
          result=$?
          echo "$result" > "$evidence/exit-code.txt"
          echo completed > "$evidence/process-completed.txt"
          cat "$evidence/stdout.log"
          cat "$evidence/stderr.log" >&2
          exit "$result"
      - name: Proxy-Formmodelle auf R01–R04 auswerten
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.sessions }}
        run: |
          SAUNA_CANDIDATE_EVIDENCE="$RUNNER_TEMP/ha-sauna-proxy-candidates"
          evidence="$SAUNA_CANDIDATE_EVIDENCE/analysis-process"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/tree.txt"
          git rev-parse HEAD:custom_components/ha_sauna > "$evidence/product-tree.txt"
          set +e
          python tests/analysis/proxy_candidate_models.py --output "$SAUNA_CANDIDATE_EVIDENCE/analysis" > "$evidence/stdout.log" 2> "$evidence/stderr.log"
          result=$?
          echo "$result" > "$evidence/exit-code.txt"
          echo completed > "$evidence/process-completed.txt"
          cat "$evidence/stdout.log"
          cat "$evidence/stderr.log" >&2
          exit "$result"
      - name: Kandidatenanalyse und getrennte Prozessnachweise sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-candidate-analysis
          path: ${{ runner.temp }}/ha-sauna-proxy-candidates
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  proxy_form_analysis:
    needs: configuration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy_form_analysis && !inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_core }}
      - name: Alle Replay-Klimakurven auswerten und offene Zuordnungen sammeln
        env:
          SAUNA_FORM_EVIDENCE: ${{ runner.temp }}/ha-sauna-proxy-forms
        run: |
          mkdir -p "$SAUNA_FORM_EVIDENCE"
          git rev-parse HEAD > "$SAUNA_FORM_EVIDENCE/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$SAUNA_FORM_EVIDENCE/tree.txt"
          git rev-parse HEAD:custom_components/ha_sauna > "$SAUNA_FORM_EVIDENCE/product-tree.txt"
          set +e
          python tests/analysis/proxy_forms.py --output "$SAUNA_FORM_EVIDENCE" > "$SAUNA_FORM_EVIDENCE/analysis.log" 2>&1
          result=$?
          echo "$result" > "$SAUNA_FORM_EVIDENCE/analysis-exit-code.txt"
          echo completed > "$SAUNA_FORM_EVIDENCE/analysis-process-completed.txt"
          if [ "$result" -eq 0 ]; then
            python tests/analysis/render_proxy_forms.py --input "$SAUNA_FORM_EVIDENCE" --output "$SAUNA_FORM_EVIDENCE/offene-zuordnungen.html" > "$SAUNA_FORM_EVIDENCE/render.log" 2>&1
            result=$?
            echo "$result" > "$SAUNA_FORM_EVIDENCE/render-exit-code.txt"
            echo completed > "$SAUNA_FORM_EVIDENCE/render-process-completed.txt"
          fi
          echo "$result" > "$SAUNA_FORM_EVIDENCE/exit-code.txt"
          echo completed > "$SAUNA_FORM_EVIDENCE/process-completed.txt"
          cat "$SAUNA_FORM_EVIDENCE/analysis.log"
          exit "$result"
      - name: Kurven und Zuordnungsdatei sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-form-analysis
          path: ${{ runner.temp }}/ha-sauna-proxy-forms
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  curve_compare:
    needs: configuration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.curve_compare && !inputs.proxy_form_analysis && !inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_ha }}
      - name: Bestehende Kurven-Testklasse gepaart messen
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.core }}
        env:
          CURVE_BASE: ${{ inputs.curve_base }}
          CURVE_CANDIDATE: ${{ inputs.curve_candidate }}
          CURVE_REPETITIONS: ${{ inputs.curve_repetitions }}
          CURVE_SELECTION: ${{ needs.configuration.outputs.core_tests }}
          CURVE_SETTINGS: ${{ needs.configuration.outputs.settings }}
          CURVE_EVIDENCE: ${{ runner.temp }}/ha-sauna-curve-comparison
        run: |
          python - <<'PY'
          import ast, hashlib, json, os, platform, re, subprocess, sys, tempfile
          from pathlib import Path

          evidence = Path(os.environ['CURVE_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=True)
          settings = json.loads(os.environ['CURVE_SETTINGS'])
          report = {'description': 'Existing CurveChangeTests: synthetic cases and real R04 fixture; class times only, not full replay performance.', 'blocks': []}
          worktrees = {}
          status = 1
          def git(*arguments, cwd=None):
              return subprocess.check_output(['git', *arguments], cwd=cwd, text=True, stderr=subprocess.STDOUT, timeout=settings['timeouts_s']['git']).strip()

          worker = evidence / 'worker.py'
          worker.write_text(r'''
          import json, sys, time, traceback, unittest
          from pathlib import Path

          root, output = map(Path, sys.argv[1:3])
          repeats = int(sys.argv[3])
          sys.path[:0] = [str(root / 'tests'), str(root)]
          result = {'wall_ns': None, 'process_cpu_ns': None, 'testsRun': 0, 'failures': 0, 'errors': 0, 'skips': 0}
          status = 1
          try:
              from test_curve_change import CurveChangeTests
              names = unittest.defaultTestLoader.getTestCaseNames(CurveChangeTests)
              result['test_ids'] = ['test_curve_change.CurveChangeTests.' + name for name in names]
              suite = unittest.TestSuite(CurveChangeTests(name) for _ in range(repeats) for name in names)
              wall, cpu = time.perf_counter_ns(), time.process_time_ns()
              try:
                  tested = unittest.TextTestRunner(verbosity=2).run(suite)
              finally:
                  result.update(wall_ns=time.perf_counter_ns() - wall, process_cpu_ns=time.process_time_ns() - cpu)
              result.update(testsRun=tested.testsRun, failures=len(tested.failures), errors=len(tested.errors), skips=len(tested.skipped))
              status = 0 if tested.wasSuccessful() and tested.testsRun == len(names) * repeats and names and not tested.skipped else 1
          except BaseException:
              traceback.print_exc()
          finally:
              result.update(exit_code=status, worker_completed=True)
              output.write_text(json.dumps(result, indent=2) + '\n')
          sys.exit(status)
          ''', encoding='utf-8')
          # The literal above is unindented after YAML removes the run-block indent.
          worker_sha = hashlib.sha256(worker.read_bytes()).hexdigest()
          try:
              refs = {'A': os.environ['CURVE_BASE'], 'B': os.environ['CURVE_CANDIDATE']}
              if not all(re.fullmatch(r'[0-9a-f]{40}', value) for value in refs.values()):
                  raise ValueError('Both references must be exact full lowercase commit SHAs')
              repeats = int(os.environ['CURVE_REPETITIONS'])
              if repeats < 1:
                  raise ValueError('curve_repetitions must be a positive integer')
              report.update(requested_refs=refs, repetitions=repeats, worker_sha256=worker_sha,
                            workflow_commit=git('rev-parse', 'HEAD'), workflow_tree=git('rev-parse', 'HEAD^{tree}'),
                            github_sha=os.environ['GITHUB_SHA'], python=sys.version, executable=sys.executable,
                            runner={key: os.environ.get(key) for key in ('RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH')},
                            platform=platform.platform())
              for label, ref in refs.items():
                  (evidence / f'fetch-{label}.log').write_text(git('fetch', '--no-tags', '--depth=1', 'origin', ref) + '\n')
                  if git('rev-parse', '--verify', ref + '^{commit}') != ref:
                      raise ValueError('Fetched commit differs from requested SHA')
              diff = git('diff', '--name-status', refs['A'], refs['B'])
              (evidence / 'product-diff.txt').write_text(diff + '\n')
              curve = 'custom_components/ha_sauna/core/curve_change.py'
              if git('diff', '--name-only', refs['A'], refs['B']).splitlines() != [curve]:
                  raise ValueError('Paired references must differ only in curve_change.py')
              with tempfile.TemporaryDirectory(prefix='sauna-curve-', dir=os.environ['RUNNER_TEMP']) as temporary:
                  metadata = {}
                  try:
                      for label, ref in refs.items():
                          path = Path(temporary) / label
                          git('worktree', 'add', '--detach', str(path), ref)
                          worktrees[label] = path
                          metadata[label] = {name: git('rev-parse', expression, cwd=path) for name, expression in (
                              ('actualCommit', 'HEAD'), ('tree', 'HEAD^{tree}'), ('curveblob', 'HEAD:' + curve),
                              ('test_tree', 'HEAD:tests'), ('defaultsblob', 'HEAD:custom_components/ha_sauna/defaults.json'))}
                          if metadata[label]['actualCommit'] != ref:
                              raise ValueError('Worktree commit differs from requested SHA')
                      report['states'] = metadata
                      for key in ('test_tree', 'defaultsblob'):
                          if metadata['A'][key] != metadata['B'][key]:
                              raise ValueError('Tests, fixtures or defaults differ')
                      source = ast.parse((worktrees['A'] / 'tests/test_curve_change.py').read_text())
                      definition = next(node for node in source.body if isinstance(node, ast.ClassDef) and node.name == 'CurveChangeTests')
                      names = sorted('test_curve_change.CurveChangeTests.' + node.name for node in definition.body if isinstance(node, ast.FunctionDef) and node.name.startswith('test_'))
                      selection = json.loads(os.environ['CURVE_SELECTION'])
                      if not names or (selection and sorted(selection) != names):
                          raise ValueError('core_tests must select the complete unchanged CurveChangeTests class')
                      report['test_ids'] = names
                      plan = [('A', 1, True), ('B', 1, True)] + [(label, repeats, False) for label in 'ABBABAAB']
                      report['plan'] = plan
                      environment = {**os.environ, 'PYTHONHASHSEED': '0', 'PYTHONDONTWRITEBYTECODE': '1'}
                      environment.pop('PYTHONPATH', None)
                      for index, (label, count, warmup) in enumerate(plan):
                          block = evidence / f'{index:02d}-{label}'
                          block.mkdir()
                          meta = {**metadata[label], 'label': label, 'repetitions': count, 'warmup': warmup,
                                  'worker_sha256': worker_sha, 'python': report['python'], 'runner': report['runner']}
                          (block / 'metadata.json').write_text(json.dumps(meta, indent=2) + '\n')
                          with (block / 'process.log').open('w') as log:
                              process = subprocess.run([sys.executable, '-B', str(worker), str(worktrees[label]), str(block / 'result.json'), str(count)], cwd=worktrees[label], env=environment, stdout=log, stderr=subprocess.STDOUT)
                          (block / 'exit-code.txt').write_text(str(process.returncode) + '\n')
                          (block / 'process-completed.txt').write_text('completed\n')
                          measured = json.loads((block / 'result.json').read_text())
                          report['blocks'].append({**meta, **measured, 'process_exit': process.returncode})
                          if process.returncode or measured['test_ids'] != names or measured['testsRun'] != len(names) * count:
                              raise RuntimeError('Incomplete or unsuccessful class block; see process evidence')
                      status = 0
                  finally:
                      for path in worktrees.values():
                          git('worktree', 'remove', '--force', str(path))
          except BaseException as error:
              status = 1
              report['error'] = repr(error)
          finally:
              report.update(exit_code=status, process_completed=True)
              (evidence / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
              (evidence / 'exit-code.txt').write_text(str(status) + '\n')
              (evidence / 'process-completed.txt').write_text('completed\n')
          print(json.dumps(report))
          sys.exit(status)
          PY
      - name: Gepaarte Kurvenmessung sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curve-comparison
          path: ${{ runner.temp }}/ha-sauna-curve-comparison
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  ha:
    needs: configuration
    if: ${{ !inputs.curve_compare && !inputs.proxy_form_analysis && !inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis && contains(fromJSON(needs.configuration.outputs.checks), 'ha') }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.ha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_ha }}
      - run: python tests/ci_settings.py install-ha
      - name: Versionsformat für Home Assistant und HACS prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from awesomeversion import AwesomeVersion

          manifest = json.loads(Path("custom_components/ha_sauna/manifest.json").read_text())
          version = AwesomeVersion(manifest["version"])
          assert version.valid, f"Ungültige Version: {version}"
          print(f"Version: {version}; Format: {version.strategy.value}; Beta: {version.beta}")
          PY
      - name: HA-Adapter prüfen
        id: ha_adapter
        if: ${{ needs.configuration.outputs.ha_tests != '[]' || needs.configuration.outputs.integration_tests == '[]' }}
        run: |
          mkdir -p "$SAUNA_HA_EVIDENCE"
          git rev-parse HEAD > "$SAUNA_HA_EVIDENCE/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$SAUNA_HA_EVIDENCE/tree.txt"
          set +e
          python tests/ci_settings.py ha > "$SAUNA_HA_EVIDENCE/process.log" 2>&1
          result=$?
          echo "$result" > "$SAUNA_HA_EVIDENCE/exit-code.txt"
          echo completed > "$SAUNA_HA_EVIDENCE/process-completed.txt"
          cat "$SAUNA_HA_EVIDENCE/process.log"
          exit "$result"
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.ha_adapter }}
        env:
          HA_TEST_REQUIRED: '1'
          SAUNA_HA_TESTS: ${{ inputs.ha_tests }}
          SAUNA_HA_EVIDENCE: ${{ runner.temp }}/ha-sauna-adapter
      - run: python tests/ci_settings.py integration
        if: ${{ !cancelled() && (needs.configuration.outputs.integration_tests != '[]' || needs.configuration.outputs.ha_tests == '[]') }}
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.integration }}
        env:
          HA_TEST_REQUIRED: '1'
          SAUNA_INTEGRATION_TESTS: ${{ inputs.integration_tests }}
      - name: HA-Adapterprozess sichern
        if: ${{ always() && (needs.configuration.outputs.ha_tests != '[]' || needs.configuration.outputs.integration_tests == '[]') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ha-adapter-tests
          path: ${{ runner.temp }}/ha-sauna-adapter
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  sessions:
    needs: configuration
    if: ${{ !inputs.curve_compare && !inputs.proxy_form_analysis && !inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis && contains(fromJSON(needs.configuration.outputs.checks), 'sessions') }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.sessions }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.configuration.outputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_ha }}
      - run: python tests/ci_settings.py install-ha
      - name: Vollständige Sitzungen und gebundene Realdaten-Replays
        run: |
          mkdir -p "$SAUNA_SESSION_EVIDENCE"
          git rev-parse HEAD > "$SAUNA_SESSION_EVIDENCE/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$SAUNA_SESSION_EVIDENCE/tree.txt"
          set +e
          if [ "$SAUNA_REPLAY_PROFILE" = 'true' ]; then
            python tests/sessions/profile_replay.py > "$SAUNA_SESSION_EVIDENCE/process.log" 2>&1
          else
            python -m unittest discover -s tests/sessions -v > "$SAUNA_SESSION_EVIDENCE/process.log" 2>&1
          fi
          result=$?
          echo "$result" > "$SAUNA_SESSION_EVIDENCE/exit-code.txt"
          echo completed > "$SAUNA_SESSION_EVIDENCE/process-completed.txt"
          cat "$SAUNA_SESSION_EVIDENCE/process.log"
          exit "$result"
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.sessions }}
        env:
          HA_TEST_REQUIRED: '1'
          TMPDIR: /dev/shm
          SAUNA_REPLAY_PROFILE: ${{ inputs.replay_profile }}
          SAUNA_SESSION_CASE: ${{ matrix.case }}
          SAUNA_SESSION_EVIDENCE: ${{ runner.temp }}/ha-sauna-sessions
      - name: Gebundene Sitzungsbewertungen sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-${{ matrix.case }}
          path: ${{ runner.temp }}/ha-sauna-sessions
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
  browser:
    needs: configuration
    if: ${{ !inputs.curve_compare && !inputs.proxy_form_analysis && !inputs.proxy_candidate_analysis && !inputs.proxy_expectation_analysis && contains(fromJSON(needs.configuration.outputs.checks), 'browser') }}
    runs-on: ${{ fromJSON(needs.configuration.outputs.settings).operating_system }}
    timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).job_timeouts_minutes.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ fromJSON(needs.configuration.outputs.settings).python_ha }}
      - run: python -m pip install -r tests/browser/requirements.txt
      - name: Kompressionsbackend prüfen
        run: |
          python -m pip check
          python - <<'PY'
          from isal import isal_zlib
          import aiohttp_fast_zlib
          from aiohttp.compression_utils import ZLibBackend

          assert aiohttp_fast_zlib.best_zlib is isal_zlib
          aiohttp_fast_zlib.enable()
          assert ZLibBackend.name == isal_zlib.__name__
          print(f"Kompressionsbackend: {ZLibBackend.name}")
          PY
      - run: python -m playwright install --with-deps ${{ fromJSON(needs.configuration.outputs.browser).engine }}
      - name: Node-Browserwerkzeuge vorbereiten
        run: |
          python - <<'PY'
          import os
          import subprocess
          from importlib.metadata import version
          from pathlib import Path

          runtime = Path(os.environ["RUNNER_TEMP"]) / "ha-sauna-node"
          subprocess.run([
              "npm", "install", "--prefix", str(runtime), "--ignore-scripts",
              "--no-package-lock", f"playwright@{version('playwright')}",
          ], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"NODE_PATH={runtime / 'node_modules'}\n")
          PY
      - name: Sitzungsverlauf – Browserinteraktionen
        run: node tests/browser/live_history/accept.cjs
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.live_history }}
        env:
          ENGINE: ${{ fromJSON(needs.configuration.outputs.browser).engine }}
          HISTORY_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/live-history
      - name: Sitzungsverlauf – Lade- und Aktualisierungsmessung
        run: node tests/browser/live_history/profile.cjs
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.live_history }}
        env:
          ENGINE: ${{ fromJSON(needs.configuration.outputs.browser).engine }}
          HISTORY_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/live-history
      - name: Detailansicht – Zustandserhalt und Marker
        run: node tests/browser/live_history/details.cjs
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.live_history }}
        env:
          ENGINE: ${{ fromJSON(needs.configuration.outputs.browser).engine }}
          DETAILS_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/details
      - name: Sitzungsverlauf – Zoom und Nachträge
        run: node tests/browser/live_history/interaction.cjs
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.live_history }}
        env:
          ENGINE: ${{ fromJSON(needs.configuration.outputs.browser).engine }}
          INTERACTION_EVIDENCE: ${{ runner.temp }}/ha-sauna-browser/live-history/interaction.json
      - run: python -u tests/browser/run.py
        timeout-minutes: ${{ fromJSON(needs.configuration.outputs.settings).step_timeouts_minutes.ha_browser }}
        env:
          HA_TEST_REQUIRED: '1'
          HA_SAUNA_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/ha-sauna-browser
      - name: Browseransichten sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-views
          path: ${{ runner.temp }}/ha-sauna-browser
          if-no-files-found: ignore
          retention-days: ${{ fromJSON(needs.configuration.outputs.settings).artifact_retention_days }}
