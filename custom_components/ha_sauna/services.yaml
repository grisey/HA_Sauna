send_notification:
  name: Benachrichtigung senden
  description: Übergibt eine ausdrücklich angegebene Nachricht an konfigurierte Empfänger. Die Antwort beschreibt die Transportübergabe, keinen Geräteempfang.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
    message:
      name: Nachricht
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      selector:
        text:
    data:
      name: Native Benachrichtigungsdaten
      selector:
        object:
    audience:
      name: Empfängerauswahl
      default: session
      selector:
        select:
          options:
            - session
            - users
    user_ids:
      name: Explizite zugeordnete Benutzer
      description: Nur bei Auswahl users; verwendet ausschließlich gespeicherte Empfängerzuordnungen.
      selector:
        object:

forget_notification:
  name: Benachrichtigungszuordnung entfernen
  description: Entfernt die flüchtige Antwortzuordnung einer Nachricht. Die Nachricht auf dem Endgerät wird dadurch nicht gelöscht.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
    message_id:
      name: Nachrichtenkennung
      description: message_id aus dem entsprechenden handoffs-Ergebnis des Sendedienstes.
      required: true
      selector:
        text:

recognition_feedback:
  name: Rückmeldung zur Erkennung
  description: Lehnt ein erkanntes Ereignis für das Nachlernen ab oder hebt die Ablehnung auf. Angabe über die Ereigniskennung oder über Art und Zeit (nächstes Ereignis dieser Art). Wirksam mit dem nächsten Nachlernen.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
    verdict:
      name: Rückmeldung
      required: true
      selector:
        select:
          options:
            - reject
            - confirm
    event_id:
      name: Ereigniskennung
      selector:
        text:
    kind:
      name: Ereignisart
      selector:
        select:
          options:
            - door_open
            - door_close
            - ventilation_confirmed
            - ventilation_complete
            - infusion
    at:
      name: Zeitpunkt
      selector:
        datetime:
    session_id:
      name: Sitzung
      selector:
        text:
recognition_release:
  name: Sitzung für das Nachlernen freigeben
  description: Gibt eine gespeicherte Sitzung für das Nachlernen frei oder nimmt die Freigabe zurück. Gespeicherte Sitzungen sind zunächst nicht freigegeben; nur freigegebene gehen in das nächste Nachlernen ein.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
    session_id:
      name: Sitzung
      required: true
      selector:
        text:
    released:
      name: Freigegeben
      required: true
      selector:
        boolean:
recognition_learn:
  name: Erkennung nachlernen
  description: Schätzt die Erkennungsgrößen aus Startwissen, freigegebenen Sitzungsbelegen und Rückmeldungen neu. Die neuen Größen gelten ab der nächsten Sitzung.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
start_calibration:
  name: Kalibrierung starten
  description: Ohne laufende Sitzung startet eine Kalibriersitzung im Automatikbetrieb; ihre Module folgen nach Bereit. In einer laufenden Sitzung startet ein einzelnes Modul, sobald kein Gang aktiv ist. Die Anweisungen gehen an die Companion-Ziele mit Antworten des startenden Benutzers.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
    module:
      name: Einzelnes Modul
      description: Nur in einer laufenden Sitzung.
      selector:
        select:
          options:
            - P
            - A1
            - A2
            - A3
            - CB
            - D
    modules:
      name: Module der Kalibriersitzung
      description: Nur ohne laufende Sitzung; ohne Angabe alle Module, ohne Präsenzsensor ohne Modul P.
      selector:
        select:
          multiple: true
          options:
            - P
            - A1
            - A2
            - A3
            - CB
            - D
cancel_calibration:
  name: Kalibrierung abbrechen
  description: Beendet die laufende Kalibrierung. Sitzung und Saunabetrieb laufen weiter.
  fields:
    entry_id:
      name: Sauna-Instanz
      required: true
      selector:
        config_entry:
          integration: ha_sauna
