name: "SHT35 via PCA9548A -> MQTT"
version: "1.2"
slug: "sht35_pca_mqtt"
description: "Reads fixed SHT35 channels 3 and 6 via PCA9548A (0x70) on /dev/i2c-1 and publishes to MQTT with HA Discovery. Optional PCA reset button via MQTT."
arch: [aarch64, amd64]
startup: services
init: false
gpio: true

devices:
  - /dev/i2c-1
  - /dev/gpiochip0

options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_discovery_prefix: homeassistant
  mqtt_base_topic: "sensors/sht35_pca"
  device_name: "Yellow J11 SHT35 PCA"
  interval_seconds: 10
  i2c_bus: 1
  pca_address: 112 # 0x70
  sht_address: 68 # 0x44
  publish_status_sensors: true
  publish_nan_on_error: false
  publish_reset_button: true
  reset_gpiochip: "gpiochip0"
  reset_gpioline: 4
  reset_pulse_ms: 50
  debug_log: false

schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  mqtt_discovery_prefix: str
  mqtt_base_topic: str
  device_name: str
  interval_seconds: int
  i2c_bus: int
  pca_address: int
  sht_address: int
  publish_status_sensors: bool
  publish_nan_on_error: bool
  publish_reset_button: bool
  reset_gpiochip: str
  reset_gpioline: int
  reset_pulse_ms: int
  debug_log: bool
